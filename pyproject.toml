[project]
name = "lanscanner"
version = "0.1.0"
description = "Home LAN inventory and passive security assessment web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
lanscanner = "main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

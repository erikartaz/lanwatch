services:
  lanwatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lanwatch
    restart: unless-stopped
    # CRITICO PER UNO SCANNER DI RETE:
    # 'network_mode: host' è indispensabile affinché il container utilizzi direttamente
    # lo stack di rete dell'host Proxmox/VM (accedendo alla tabella ARP reale del kernel,
    # ascoltando i pacchetti multicast mDNS/SSDP e raggiungendo le porte della LAN 192.168.1.0/24).
    network_mode: host
    environment:
      - PORT=8088
      - DATA_DIR=/data
      - TZ=Europe/Rome
      # Opzionale: credenziali amministratore predefinite (configurabili anche via Web UI al primo accesso)
      # - LANWATCH_ADMIN_USER=admin
      # - LANWATCH_ADMIN_PASSWORD=password_segreta_qui
    volumes:
      # Directory per il database persistente SQLite (lanscanner.db)
      - ./data:/data
      # Mount dei file dell'app e frontend per aggiornamenti istantanei via git pull
      - ./lanscanner:/app/lanscanner
    cap_add:
      - NET_ADMIN
      - NET_RAW
